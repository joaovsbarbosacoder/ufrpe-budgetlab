<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>UFRPE BudgetLab</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: #f4f7fb; color: #0e1f3d; font-family: "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0; color: #5b6b86; }
  .giro { width: 34px; height: 34px; margin-bottom: 18px; border: 4px solid #cbd6e6;
          border-top-color: #1f5fbf; border-radius: 50%; animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="giro"></div>
  <h1>Iniciando o UFRPE BudgetLab...</h1>
  <p>Isso leva alguns segundos.</p>
</body>
</html>
