[theme]
base = "dark"
primaryColor = "#4C8DFF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121B2D"
textColor = "#E7ECF5"
borderColor = "#232E45"
blueColor = "#4C8DFF"
greenColor = "#22C55E"
yellowColor = "#F5A524"
redColor = "#F0576B"
font = "sans serif"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "large"
buttonRadius = "medium"
showWidgetBorder = true
linkUnderline = false

[theme.sidebar]
backgroundColor = "#0E1626"
secondaryBackgroundColor = "#121B2D"
textColor = "#E7ECF5"
borderColor = "#232E45"
